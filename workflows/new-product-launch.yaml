name: new-product-launch
version: 0.1
status: draft
purpose: Orchestrate a new product launch from intake through post-launch learning with explicit human decision gates.
stages:
  - id: intake
    capability: project-intake
    gate: human
  - id: product-truth
    capability: product-intelligence
  - id: research
    parallel: [market-research, customer-research, competitive-intelligence]
  - id: icp
    capability: icp
    gate: human
  - id: positioning
    capability: positioning
    gate: human
  - id: value-proposition
    capability: value-proposition
  - id: messaging
    capability: messaging
  - id: narrative
    capability: narrative
    gate: human
  - id: gtm
    capability: gtm
    gate: human
  - id: launch
    capability: launch
    gate: human
  - id: activation
    parallel: [enablement, content, demand-gen, product-activation, customer-success]
  - id: measurement
    capability: measurement
  - id: learning
    capability: post-launch-learning
principles:
  - downstream agents consume approved upstream decisions where a gate exists
  - agents expose assumptions, evidence gaps and unresolved questions
  - external publishing and high-consequence actions require an explicit approval policy
  - post-launch evidence is compared against pre-launch assumptions
